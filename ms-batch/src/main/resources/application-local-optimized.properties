# Configuración optimizada para ambiente local
# Usa valores mayores de chunk size y thread pool para mayor throughput

# Chunk size optimizado para local: procesa 50 items por chunk
bancoxyz.batch.chunk-size=50

# Thread pool optimizado: más hilos para paralelismo
bancoxyz.batch.core-pool-size=4
bancoxyz.batch.max-pool-size=8
bancoxyz.batch.queue-capacity=200
bancoxyz.batch.await-termination-seconds=120

# Retry configuration
bancoxyz.batch.retry-limit=5
bancoxyz.batch.skip-limit=50

# Backoff policy más agresivo para recuperación rápida
bancoxyz.batch.back-off-initial-interval=100
bancoxyz.batch.back-off-multiplier=1.5
bancoxyz.batch.back-off-max-interval=1000

spring.datasource.url=jdbc:h2:mem:bancoxyz
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

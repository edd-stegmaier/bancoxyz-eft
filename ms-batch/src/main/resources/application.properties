spring.application.name=bancoxyz
spring.profiles.default=h2

# Oracle Autonomous Database (mTLS con wallet)
# Exporta las variables o crea application-local.properties (gitignored).
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS}?TNS_ADMIN=${ORACLE_WALLET_DIR}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# schema.sql crea las tablas de negocio; continue-on-error evita fallar si ya existen
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Primera ejecucion contra Oracle: always. Luego puedes cambiarlo a never.
spring.batch.jdbc.initialize-schema=always
# Evita que Boot lance un job al azar; JobStartupRunner controla cuales corren.
spring.batch.job.enabled=false

# ========== CONFIGURACIÓN DE OPTIMIZACIÓN DE BATCH ==========
# Estos valores pueden ser sobrescritos en perfiles (test, local, prod)

# Chunk size: cantidad de items a procesar en cada transacción
# Valores: 10 (test), 50 (local optimizado), 100+ (producción)
bancoxyz.batch.chunk-size=10

# Thread pool configuration para paralelismo
# Core pool: threads siempre activos
# Max pool: threads máximos permitidos
# Queue capacity: tareas en espera
bancoxyz.batch.core-pool-size=2
bancoxyz.batch.max-pool-size=4
bancoxyz.batch.queue-capacity=100
bancoxyz.batch.await-termination-seconds=60

# Retry configuration
bancoxyz.batch.retry-limit=3
bancoxyz.batch.skip-limit=20

# Exponential backoff policy
# Initial interval en ms: tiempo inicial entre reintentos
# Multiplier: factor exponencial
# Max interval en ms: límite máximo de espera
bancoxyz.batch.back-off-initial-interval=200
bancoxyz.batch.back-off-multiplier=2.0
bancoxyz.batch.back-off-max-interval=2000
spring.batch.job.enabled=false

# all | lista separada por coma: interesesJob,transaccionesJob,resumenesJob
bancoxyz.jobs=all

bancoxyz.archivo-cuentas-anuales=classpath:data/cuentas_anuales.csv
bancoxyz.archivo-intereses=classpath:data/intereses.csv
bancoxyz.archivo-transacciones=classpath:data/transacciones.csv

bancoxyz.batch.core-pool-size=2
bancoxyz.batch.max-pool-size=4
bancoxyz.batch.queue-capacity=50

logging.level.org.springframework.batch=INFO
logging.level.com.duoc.bancoxyz=DEBUG
server.port=8084

# Configuración optimizada para ambiente de producción
# Valores máximos para throughput y estabilidad con recursos limitados

# Chunk size grande: procesa 100 items por chunk
# Considerar: tamaño_fila × 100 debe caber en memoria disponible
bancoxyz.batch.chunk-size=100

# Thread pool optimizado para producción: balance entre throughput y overhead
# No demasiados hilos (evita context switching excesivo)
bancoxyz.batch.core-pool-size=6
bancoxyz.batch.max-pool-size=12
bancoxyz.batch.queue-capacity=300
bancoxyz.batch.await-termination-seconds=180

# Retry configuration: más reintentos en producción para resiliencia
bancoxyz.batch.retry-limit=5
bancoxyz.batch.skip-limit=100

# Backoff policy conservador para recuperación estable
bancoxyz.batch.back-off-initial-interval=500
bancoxyz.batch.back-off-multiplier=2.0
bancoxyz.batch.back-off-max-interval=5000

spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

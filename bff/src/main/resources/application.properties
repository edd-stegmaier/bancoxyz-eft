spring.application.name=bancoxyzBFF
server.port=8090

bancoxyz-backend.base-url=http://localhost:8080

# Timeouts al llamar a bancoxyzBackend: si no responde a tiempo,
# el BFF falla rapido en vez de dejar la solicitud esperando indefinidamente.
backend.connect-timeout-ms=2000
backend.read-timeout-ms=3000

logging.level.com.duoc.bancoxyz.bff=DEBUG
